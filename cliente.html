<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Test</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
  <script>
    // Conecta ao WebSocket do servidor
    const socket = io("http://localhost:3000");

    // Quando conecta com sucesso
    socket.on("connect", () => {
      console.log("Conectado ao WebSocket com ID:", socket.id);
    });

    // Escuta o evento de novo usuário
    socket.on("novo_usuario", (data) => {
      console.log("Novo usuário chegou:", data);
    });

    // Escuta o evento de novo pedido
    socket.on("novo_pedido", (data) => {
      console.log("Novo pedido criado:", data);
    });
  </script>
</body>
</html>
